{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
{{- if not .Values.externalDatabase.url }}
{{- fail "postgresql.enabled=false requires externalDatabase.url or externalDatabase.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oan.fullname" . }}-database
  labels:
    {{- include "oan.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
{{- end }}
