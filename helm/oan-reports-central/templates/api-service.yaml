apiVersion: v1
kind: Service
metadata:
  name: {{ include "oan.fullname" . }}-api
  labels:
    {{- include "oan.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "oan.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
