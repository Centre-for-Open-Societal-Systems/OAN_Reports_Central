# Default values for oan-reports-central.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# Pull images from Amazon ECR. A CronJob refreshes the docker-registry Secret
# (ECR tokens expire after 12h) and it is added to every pod's imagePullSecrets.
# Set api/web image.repository to the full ECR URLs (terraform output repository_urls).
ecr:
  enabled: false
  registry: ""          # <account>.dkr.ecr.<region>.amazonaws.com (terraform output registry)
  region: ""
  pullSecretName: ecr-pull-secret
  # Empty: use the node's EC2 instance role via IMDSv2 (the dev EC2 host from infra/terraform/dev).
  # Otherwise: existing Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for the pull-only IAM user.
  awsCredentialsSecret: ""
  schedule: "0 */6 * * *"
  image:
    repository: alpine/k8s   # ships aws-cli + kubectl
    tag: "1.31.4"
    pullPolicy: IfNotPresent
  resources: {}

api:
  image:
    repository: oan-reports-central-api
    tag: ""            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8000

  # Non-secret settings, rendered into a ConfigMap
  env:
    APP_ENV: production
    # Comma-separated. Not needed when the SPA is served from the same host (ingress / nginx proxy).
    CORS_ORIGINS: ""
    UPSTREAM_TIMEOUT_SECONDS: "20"

  # Upstream chart services (see /postman). Leave blank until each service is available.
  upstreams:
    a2c: ""
    grievance: ""
    farmer: ""
    livestock: ""
    crop: ""
    gateway: ""

  # Extra env vars (list of EnvVar objects)
  extraEnv: []

  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

# Creates tables and seeds the 43 system reports after every install/upgrade.
# API pods run with SEED_ON_STARTUP=false so replicas never race on seeding.
seedJob:
  enabled: true
  backoffLimit: 4
  activeDeadlineSeconds: 600
  resources: {}

web:
  image:
    repository: oan-reports-central-web
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

service:
  type: ClusterIP

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: reports.example.org   # empty = match any host (e.g. access by IP)
  tls: []
  #  - secretName: reports-tls
  #    hosts:
  #      - reports.example.org

# Database: either the bundled single-node PostgreSQL (dev/staging),
# or an external/managed database (recommended for production).
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  auth:
    username: oan
    database: oan_reports
    # Leave empty to generate one (kept across upgrades), or use existingSecret
    password: ""
    # Secret with key "password"
    existingSecret: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Used when postgresql.enabled=false
externalDatabase:
  # Full SQLAlchemy URL, e.g. postgresql+psycopg2://user:pass@host:5432/oan_reports
  url: ""
  # Or reference a Secret holding the URL
  existingSecret: ""
  existingSecretKey: DATABASE_URL
